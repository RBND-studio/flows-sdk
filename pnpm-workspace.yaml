packages:
  - workspaces/*

engineStrict: true

overrides:
  ajv@>=7.0.0-alpha.0 <8.18.0: ">=8.18.0"
  minimatch@<3.1.4: ">=3.1.4"
  esbuild@<0.28.1: ">=0.28.1"
  brace-expansion@<=5.0.7: ^5.0.8
  shell-quote@<=1.8.4: ^1.8.5
allowBuilds:
  "@swc/core": true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - brace-expansion@2.1.2 || 5.0.8
  - js-yaml@4.3.0
  - shell-quote@1.8.5
  - fast-uri@3.1.3 || 3.1.4
